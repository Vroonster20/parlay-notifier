name: Daily Fliff Parlay

on:
  schedule:
    - cron: "32 11 * * 0" 
    - cron: "02 10 * * 1"
    - cron: "32 11 * * 2-6" 
  workflow_dispatch: {}      # lets you manually trigger a run from GitHub's UI to test

permissions:
  contents: write

jobs:
  run-parlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          THE_ODDS_KEY: ${{ secrets.THE_ODDS_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MODE: live

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/parlays.json
          git diff --staged --quiet || git commit -m "Update parlay history"
          git push